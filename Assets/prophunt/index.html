<link rel="stylesheet" href="app.css">

<div class="app" id="app">

  <!-- The rail is the instrument panel: what phase, how long, how many are left, what you are, how you are
       doing. It never scrolls and it is never replaced, so a glance always lands in the same place. -->
  <div class="rail" id="rail">

    <!-- Phase on the left, who you are in this session on the right. The second one answers "why can I not press
         anything" without the player having to work it out from the absence of buttons. -->
    <div class="rail-top">
      <div class="stamp phase" id="phase">LOBBY</div>
      <div class="stamp seat" id="seat"></div>
    </div>

    <div class="rail-mid">
      <div class="clockbox" id="clockbox">
        <div class="clock" id="clock"></div>
        <div class="gauge" id="gauge"></div>
        <div class="clock-note" id="clocknote"></div>
      </div>

      <div class="tally-box" id="tallybox">
        <div class="tally-head">
          <div class="tally-label">HIDERS LEFT</div>
          <div class="tally-count" id="tallycount">0 / 0</div>
        </div>
        <div class="tally" id="tally"></div>
      </div>
    </div>

    <div class="stamp role" id="role">WAITING</div>

    <div class="vitals" id="vitals"></div>
  </div>

  <div class="main">
    <div class="nav" id="nav">
      <div class="tab on" data-pane="board"><img src="icons/board.png" width="17" height="17"><div class="tab-label">Board</div></div>
      <div class="tab" data-pane="roster"><img src="icons/roster.png" width="17" height="17"><div class="tab-label">Roster</div></div>
      <div class="tab" data-pane="rules"><img src="icons/rules.png" width="17" height="17"><div class="tab-label">Rules</div></div>
      <div class="tab" data-pane="scores"><img src="icons/scores.png" width="17" height="17"><div class="tab-label">Scores</div></div>
    </div>

    <div class="pane" id="pane"></div>
  </div>

  <!-- The top layer. Anything in here is `position: fixed`, so Sideload measures it against the whole screen,
       draws it after everything else and lets it take the pointer - which is what makes a modal a modal rather
       than a picture of one. Empty except while something is being confirmed. -->
  <div id="layer"></div>

</div>

<script src="app.js"></script>
